name: future_engineer
description: "تطبيق مهندس المستقبل — رحلة تفاعلية استكشافية للهواتف الذكية (Flutter Mobile App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Typography & Animations
  google_fonts: ^6.1.0
  confetti: ^0.7.0

  # Persistence & Printing
  shared_preferences: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
